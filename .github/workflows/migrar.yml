name: migrar
on:
  push:
    branches: [main]
    paths: ['migrations/**']
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npx --yes wrangler d1 migrations apply oauth-sessions-gabriel --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Bônus: resumo por IA das migrações deste push no resumo da execução.
      - run: npm install -g @github/copilot
      - name: Monta o prompt do resumo
        run: |
          {
            echo "Resuma em português, em até 5 itens, o que estas migrações D1 mudaram no banco:"
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- migrations/ | xargs -r cat
          } > resumo.txt
      - id: resumo
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: resumo.txt
          model: ""
      - run: cat "${{ steps.resumo.outputs.response-file }}" >> "$GITHUB_STEP_SUMMARY"
