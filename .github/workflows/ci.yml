name: ci
on:
  push:
  pull_request:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Procura segredos versionados
        # O próprio ci.yml contém o padrão GOCSPX- e casaria consigo mesmo.
        run: |
          if git grep -nE "GOCSPX-|client_secret *= *['\"][^'\"]+" -- . ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "::error::Possível segredo no repositório"; exit 1
          fi
      - name: Aplica as migrações D1 em um SQLite local
        run: |
          for f in migrations/*.sql; do sqlite3 teste.db < "$f" || exit 1; done
          sqlite3 teste.db ".tables"
      - name: Valida HTML
        run: npx --yes htmlhint "**/*.html"
